# codemagic.yaml
workflows:
  ios-debug-altserver:
    name: "GabaritScan — Debug pour AltServer"
    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Cloner les sources AprilTag C
      - name: "Cloner AprilTag C"
        script: |
          rm -rf GabaritScan/Native/apriltag
          git clone --depth=1 https://github.com/AprilRobotics/apriltag.git GabaritScan/Native/apriltag
          echo "✅ AprilTag cloné"

      # 2. Générer le fichier .xcodeproj avec XcodeGen
      - name: "Générer Xcode project via XcodeGen"
        script: |
          if ! command -v xcodegen &> /dev/null; then
            echo "Installation de xcodegen..."
            brew install xcodegen
          fi
          xcodegen generate
          echo "✅ GabaritScan.xcodeproj généré avec succès"

      # 3. Compiler l'archive
      - name: "Build Archive non signée"
        script: |
          xcodebuild \
            -project GabaritScan.xcodeproj \
            -scheme GabaritScan \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/GabaritScan.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # 4. Exporter l'IPA pour AltServer
      - name: "Exporter IPA"
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/GabaritScan.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ipa/*.ipa
      - build/ipa/*.plist
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - zakariakaddouri02@gmail.com
        notify:
          success: true
          failure: true
