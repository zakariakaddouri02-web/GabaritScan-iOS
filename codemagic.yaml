# codemagic.yaml
workflows:
  ios-debug-altserver:
    name: "GabaritScan — Debug pour AltServer"
    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Cloner AprilTag C et nettoyer les fichiers inutiles
      - name: "Cloner et nettoyer AprilTag C"
        script: |
          rm -rf GabaritScan/Native/apriltag
          git clone --depth=1 https://github.com/AprilRobotics/apriltag.git GabaritScan/Native/apriltag
          
          rm -rf GabaritScan/Native/apriltag/test
          rm -rf GabaritScan/Native/apriltag/example
          rm -rf GabaritScan/Native/apriltag/gui
          find GabaritScan/Native/apriltag -name "CMakeLists.txt" -delete
          find GabaritScan/Native/apriltag -name "*.cmake" -delete
          find GabaritScan/Native/apriltag -name "*demo*" -delete
          find GabaritScan/Native/apriltag -name "*python*" -delete
          find GabaritScan/Native/apriltag -name "*_py_*" -delete
          find GabaritScan/Native/apriltag -name "*.py" -delete
          echo "✅ AprilTag cloné et nettoyé"

      # 2. Générer le fichier .xcodeproj avec XcodeGen
      - name: "Générer Xcode project via XcodeGen"
        script: |
          if ! command -v xcodegen &> /dev/null; then
            echo "Installation de xcodegen..."
            brew install xcodegen
          fi
          xcodegen generate
          echo "✅ GabaritScan.xcodeproj généré avec succès"

      # 3. Compiler l'archive
      - name: "Build Archive"
        script: |
          xcodebuild \
            -project GabaritScan.xcodeproj \
            -scheme GabaritScan \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/GabaritScan.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # 4. Empaqueter l'IPA pour AltServer (sans besoin de compte Apple payant)
      - name: "Empaqueter IPA pour AltServer"
        script: |
          mkdir -p build/ipa/Payload
          cp -r build/GabaritScan.xcarchive/Products/Applications/GabaritScan.app build/ipa/Payload/
          cd build/ipa
          zip -qr GabaritScan.ipa Payload
          rm -rf Payload
          echo "✅ GabaritScan.ipa créé avec succès pour AltServer"

    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - zakariakaddouri02@gmail.com
        notify:
          success: true
          failure: true
